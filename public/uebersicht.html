<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/css/brodos.css"><title>Start · BroKI</title></head>
<body class="ansicht">
  <aside class="seitenleiste">
    <h2>Auswahl</h2>
    <div id="wahl" class="akkordeon"></div>
  </aside>
  <main class="inhalt">
    <div class="seitenkopf">
      <div><h1 id="titel">Was möchtest du abhalten?</h1><p id="unterzeile" class="unterzeile"></p></div>
    </div>
    <div id="meldung" class="hinweisband" role="alert"></div>

    <!-- Start: Meeting oder Workshop -->
    <div id="b-start" class="kacheln" hidden></div>

    <!-- Meeting: neues einrichten oder bestehendes öffnen -->
    <div id="b-meeting" class="zweispaltig" hidden>
      <section class="kasten">
        <div class="kasten-kopf"><h2>Neues Meeting</h2></div>
        <form id="m-formular" class="kasten-inhalt stapel">
          <p class="gedaempft">Richte ein Meeting mit Name, Datum und Agenda ein. Der Meeting Assistent öffnet sich danach direkt.</p>
          <div class="reihe"><button type="button" id="m-neu"></button></div>
          <div id="m-felder" class="stapel" hidden>
            <div class="feld"><label for="m-name">Name</label><input id="m-name" type="text" maxlength="80" placeholder="z. B. Jour fixe Vertrieb"></div>
            <div class="feld"><label for="m-datum">Datum</label><input id="m-datum" type="date"></div>
            <div class="feld"><label for="m-agenda">Agenda</label><textarea id="m-agenda" rows="5" placeholder="Ein Punkt pro Zeile"></textarea><p>Hintergrundwissen und Fachbegriffe ergänzt du später im Admin unter Meetings.</p></div>
            <div class="reihe"><button type="submit" id="m-anlegen"></button><button type="button" id="m-abbrechen" class="zweit"></button></div>
          </div>
        </form>
      </section>
      <section class="kasten">
        <div class="kasten-kopf"><h2>Bestehendes Meeting</h2></div>
        <form id="m-oeffnen-formular" class="kasten-inhalt stapel">
          <p class="gedaempft">Wähle ein bestehendes Meeting aus.</p>
          <div class="feld"><select id="m-wahl" aria-label="Bestehendes Meeting"></select><p id="m-info"></p></div>
          <div class="reihe"><button type="submit" id="m-oeffnen"></button></div>
        </form>
      </section>
    </div>
  </main>
  <script type="module" src="/js/uebersicht.js"></script>
</body>
</html>
