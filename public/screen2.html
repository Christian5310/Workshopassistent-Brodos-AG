<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/css/brodos.css"><title>Spezial-Agenten · Workshop Agent</title></head>
<body>
  <header class="kopf"><span class="logo">Brodos</span><h1><a href="/">Workshop Agent</a> · Spezial-Agenten</h1><div class="status"><span id="mock" class="pille" hidden>MOCK-MODUS</span></div></header>
  <main id="chat" class="chat" aria-live="polite"></main>
  <div id="chatstatus" class="chatstatus" role="status"></div>
  <div class="wahlzeile"><span>Frage an:</span><div id="an" class="wahl" role="radiogroup" aria-label="Welcher Spezial-Agent soll antworten?">
      <button type="button" role="radio" aria-checked="true" data-wert="alle">Alle</button>
      <button type="button" role="radio" aria-checked="false" data-wert="sales" class="sales">Sales Professional</button>
      <button type="button" role="radio" aria-checked="false" data-wert="bpm" class="bpm">BPM Specialist</button>
      <button type="button" role="radio" aria-checked="false" data-wert="consultant" class="consultant">Business Consultant</button>
    </div></div>
  <form id="formular" class="eingabe">
    
    <input id="text" type="text" placeholder="Frage tippen …" autocomplete="off">
    <button type="submit">Senden</button>
    <button type="button" id="ptt" class="zweit" title="Gedrückt halten (oder Leertaste halten)">🎙 Halten zum Sprechen</button>
  </form>
  <script type="module" src="/js/screen2.js"></script>
</body>
</html>
