<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/css/brodos.css"><title>Transkriptions-Assistent · Merlin</title></head>
<body>
  <header class="kopf"><a class="logo" href="/start" title="Zur Auswahl"><img src="/img/merlin-wort.png" alt="Merlin"></a><h1>Transkriptions-Assistent</h1><div class="steuerung">
      <button id="transkript-knopf" type="button" class="schalter" aria-pressed="false" hidden>Transkript</button>
      <button id="start" type="button" class="haupt" hidden>▶ Aufnahme starten</button>
      <button id="pause" type="button" class="haupt laeuft" hidden>⏸ Pausieren</button>
      <button id="rueckgaengig" type="button" class="schalter" hidden>↶ Rückgängig</button>
      <button id="schliessen" type="button" class="schalter" hidden>Meeting schließen</button>
    </div><div class="status"><span id="mock" class="pille" hidden>MOCK-MODUS</span><span id="pegel" class="pegel" hidden title="Mikrofon-Pegel"><i></i></span><span id="mikro"><span class="punkt"></span><span>Pausiert</span></span><span id="zyklus"></span><span id="countdown"></span></div></header>
  <div class="tagleiste"><label for="tagwahl">Meeting</label><select id="tagwahl"></select><span id="tag-info"></span><span id="arbeit" class="arbeit" role="status"></span><a href="/admin" target="_blank" rel="noopener">Meetings verwalten</a></div>
  <div id="hinweis" class="hinweis"></div>
  <div id="mikrofehler" class="hinweis fehler" role="alert"></div>
  <div id="leerhinweis" class="leerhinweis" hidden></div>
  <main class="protokoll">
    <section class="spalte">
      <div class="karte"><h2>Agenda <span class="zahl">anklicken = läuft</span></h2><ul id="agenda" class="liste agenda"></ul></div>
      <div id="transkript-karte" class="karte mitschrift" hidden><h2>Transkript <span class="zahl">letzte Abschnitte</span></h2><div id="transkript" class="mitschrift-text" aria-live="off"></div></div>
    </section>
    <section class="spalte"><div class="karte"><h2>To-dos <span class="rechts"><span id="todo-zahl" class="zahl"></span><button id="ablegen" type="button" class="zweit klein" hidden title="Legt die aktuelle Liste unter dem laufenden Agendapunkt ab, damit sie kurz bleibt">Liste ablegen</button></span></h2><div id="gruppen" class="gruppen"></div><ul id="todos" class="liste todos"></ul></div>
      <div id="vorschlag-karte" class="karte vorschlaege" hidden><h2>Vorschläge <span class="zahl">unsicher – bitte entscheiden</span></h2><ul id="vorschlaege" class="liste"></ul></div></section>
    <section class="spalte">
      <div class="karte"><h2>Entscheidungen</h2><ul id="entscheidungen" class="liste seite"></ul></div>
      <div class="karte"><h2>Offene Fragen</h2><ul id="fragen" class="liste seite"></ul></div>
    </section>
  </main>
  <dialog id="schluss">
    <form method="dialog">
      <h2>Meeting schließen?</h2>
      <p id="schluss-text"></p>
      <div class="reihe">
        <button value="schliessen">Meeting schließen</button>
        <button value="abbrechen" class="zweit">Abbrechen</button>
      </div>
    </form>
  </dialog>
  <script type="module" src="/js/screen1.js"></script>
</body>
</html>
