<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/css/brodos.css"><title>Transkriptions-Assistent · Broki-Live</title></head>
<body>
  <header class="kopf"><span class="logo">Brodos</span><h1><a href="/">Broki-Live</a> · Transkriptions-Assistent</h1><button id="schalter" type="button" class="schalter" aria-pressed="false">Assistent ist aus</button><div class="status"><span id="mock" class="pille" hidden>MOCK-MODUS</span><span id="pegel" class="pegel" hidden title="Mikrofon-Pegel"><i></i></span><span id="mikro"><span class="punkt"></span><span>Pausiert</span></span><span id="zyklus"></span></div></header>
  <div id="hinweis" class="hinweis"></div>
  <div id="mikrofehler" class="hinweis fehler" role="alert"></div>
  <main class="protokoll">
    <section class="spalte"><div class="karte"><h2>Agenda</h2><ul id="agenda" class="liste agenda"></ul></div></section>
    <section class="spalte"><div class="karte"><h2>To-dos <span id="todo-zahl" class="zahl"></span></h2><ul id="todos" class="liste todos"></ul></div>
      <div id="vorschlag-karte" class="karte vorschlaege" hidden><h2>Vorschläge <span class="zahl">unsicher – bitte entscheiden</span></h2><ul id="vorschlaege" class="liste"></ul></div></section>
    <section class="spalte">
      <div class="karte"><h2>Entscheidungen</h2><ul id="entscheidungen" class="liste seite"></ul></div>
      <div class="karte"><h2>Offene Fragen</h2><ul id="fragen" class="liste seite"></ul></div>
    </section>
  </main>
  <script type="module" src="/js/screen1.js"></script>
</body>
</html>
