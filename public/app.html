<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/css/brodos.css"><title>BroKI</title></head>
<body>
  <div class="app-bg" id="app-bg">
    <div class="app-window">
      <header class="app-kopf">
        <a href="#start" title="Zur Auswahl: Meeting oder Workshop"><img class="brodos" src="/assets/brodos-logo.png" alt="Brodos"></a>
        <span class="strich" aria-hidden="true"></span>
        <img class="applogo" src="/img/broki-wort.png" alt="BroKI">
        <nav aria-label="Hauptbereiche">
          <a href="#meeting" data-nav="meeting">Meeting</a>
          <a href="#workshop" data-nav="workshop">Workshop</a>
          <a href="#archiv" data-nav="archiv">Archiv</a>
          <a href="#admin" data-nav="admin">Admin</a>
          <a href="#regie" data-nav="regie">Regie</a>
        </nav>
        <div class="rechts">
          <span id="aufnahme" class="aufnahme-anzeige" role="status"><span class="punkt"></span><span id="aufnahme-text">Keine Aufnahme</span><span id="countdown" class="countdown" hidden title="Zeit bis zum Senden des Abschnitts"><i></i></span></span>
          <button id="praesentation" type="button" class="zweit icon-knopf" aria-pressed="false" aria-label="Präsentationsmodus" title="Präsentationsmodus: Fenster und Schrift für den Beamer vergrößern"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
          <span id="mock" class="badge" hidden title="Mock-Modus: Fake-Transkript und Fake-Antworten">Mock</span>
          <span class="badge prototyp">Prototyp</span>
        </div>
      </header>
      <div id="rahmenhinweis" class="hinweisband" role="alert"></div>
      <iframe id="inhalt" title="Inhalt des gewählten Bereichs"></iframe>
    </div>

    <!-- Merlin: Sprachsteuerung, Einstimmung und Pausen-Erinnerung (public/js/merlin.js). Schwebt außerhalb des Fensters.
         Klick auf die Bubble = zuhören. Das Fenster zeigt nur Antworten, Tippen gibt es nicht. -->
    <button id="merlin-knopf" type="button" class="merlin-knopf schwebt" aria-expanded="false" aria-controls="merlin" title="Merlin: klicken, sprechen, noch einmal klicken">
      <img src="/img/merlin-avatar.png" alt="">
      <span class="sr-only">Mit Merlin sprechen</span>
    </button>
    <section id="merlin" class="merlin-panel" hidden aria-label="Merlin">
      <div class="merlin-kopf"><b>Merlin</b><button type="button" id="merlin-zurueck" class="textlink klein-text">Start</button><button type="button" id="merlin-zu" class="textlink klein-text">Schließen</button></div>
      <div id="merlin-stationen" class="merlin-stationen" role="tablist" hidden></div>
      <div id="merlin-blase" class="merlin-blase" aria-live="polite"></div>
      <textarea id="merlin-text" rows="7" hidden aria-label="Text dieser Station"></textarea>
      <div id="merlin-ansage-leiste" class="reihe" hidden>
        <button type="button" id="merlin-sprechen" class="klein"></button>
        <button type="button" id="merlin-weiter" class="zweit klein"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>Weiter</button>
        <button type="button" id="merlin-bearbeiten" class="textlink klein-text">Text bearbeiten</button>
        <button type="button" id="merlin-neu" class="textlink klein-text">Neu entwerfen</button>
      </div>
      <div id="merlin-rueckfrage" class="reihe" hidden></div>
      <div id="merlin-vorschlaege" class="merlin-chips" aria-label="Vorschläge"></div>
      <form id="merlin-eingabe" class="merlin-eingabe" hidden>
        <input id="merlin-feld" type="text" maxlength="500" autocomplete="off" placeholder="Was soll ich tun?" aria-label="Befehl an Merlin">
        <button type="button" id="merlin-mikro" class="icon-knopf" aria-pressed="false" aria-label="Sprechen: klicken, sprechen, noch einmal klicken" title="Sprechen: klicken, sprechen, noch einmal klicken"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg></button>
        <button type="submit" class="icon-knopf" aria-label="Senden" title="Senden"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button>
      </form>
      <p id="merlin-info" class="hilfe"></p>
    </section>
  </div>
  <script type="module" src="/js/shell.js"></script>
</body>
</html>
