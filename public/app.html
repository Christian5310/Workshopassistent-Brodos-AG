<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/css/brodos.css"><title>BroKI</title></head>
<body>
  <div class="app-bg" id="app-bg">
    <div class="app-window">
      <header class="app-kopf">
        <a href="#start" title="Zur Auswahl: Meeting oder Workshop"><img class="brodos" src="/assets/brodos-logo.png" alt="Brodos"></a>
        <span class="strich" aria-hidden="true"></span>
        <img class="applogo" src="/img/broki-wort.png" alt="BroKI">
        <nav aria-label="Hauptbereiche">
          <a href="#meeting" data-nav="meeting">Meeting</a>
          <a href="#workshop" data-nav="workshop">Workshop</a>
          <a href="#archiv" data-nav="archiv">Archiv</a>
          <a href="#admin" data-nav="admin">Admin</a>
          <a href="#regie" data-nav="regie">Regie</a>
        </nav>
        <div class="rechts">
          <span id="aufnahme" class="aufnahme-anzeige" role="status"><span class="punkt"></span><span id="aufnahme-text">Keine Aufnahme</span><span id="countdown" class="countdown" hidden title="Zeit bis zum Senden des Abschnitts"><i></i></span></span>
          <button id="praesentation" type="button" class="zweit icon-knopf" aria-pressed="false" aria-label="Präsentationsmodus" title="Präsentationsmodus: Fenster und Schrift für den Beamer vergrößern"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
          <span id="mock" class="badge" hidden title="Mock-Modus: Fake-Transkript und Fake-Antworten">Mock</span>
          <span class="badge prototyp">Prototyp</span>
        </div>
      </header>
      <div id="rahmenhinweis" class="hinweisband" role="alert"></div>
      <iframe id="inhalt" title="Inhalt des gewählten Bereichs"></iframe>
    </div>
  </div>
  <script type="module" src="/js/shell.js"></script>
</body>
</html>
